name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: CodexProvider.exe
          - os: macos-latest
            rid: osx-x64
            exe: CodexProvider
          - os: ubuntu-latest
            rid: linux-x64
            exe: CodexProvider
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (self-contained single file)
        run: >
          dotnet publish CodexProvider.UI/CodexProvider.UI.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexProvider-${{ matrix.rid }}
          path: publish/CodexProvider*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodexProvider.exe
            dist/CodexProvider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}